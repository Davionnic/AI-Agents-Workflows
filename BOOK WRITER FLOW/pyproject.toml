[project]
name = "book-writer-flow"
version = "0.1.0"
description = "A CrewAI flow that researches and writes books chapter by chapter"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "crewai[tools]>=0.102.0,<1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "streamlit>=1.32.0",
    "requests>=2.31.0",
]

[project.scripts]
book-writer = "book_writer_flow.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_writer_flow"]