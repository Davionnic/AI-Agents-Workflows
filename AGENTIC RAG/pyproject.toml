[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG with CrewAI — document search with web fallback"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "crewai[tools]>=0.86.0,<1.0.0",
    "streamlit>=1.32.0",
    "python-dotenv>=1.0.0",
    "chonkie[semantic]>=0.4.0",
    "markitdown>=0.0.1",
    "qdrant-client>=1.9.0",
    "fastembed>=0.3.0",
    "firecrawl-py>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]
